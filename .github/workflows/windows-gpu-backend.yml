name: Windows GPU backend support

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/filmcraft/src/graphics.rs"
      - "apps/filmcraft/src/args.rs"
      - "apps/filmcraft/src/main.rs"
      - "crates/engine/src/settings.rs"
      - "crates/engine/src/autosave.rs"
      - "crates/gpu/src/adapter.rs"
      - "crates/gpu/src/export_renderer.rs"
      - "packaging/windows/package.ps1"
      - "packaging/windows/filmcraft.wxs"
      - ".github/workflows/windows-gpu-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-gpu-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-selection:
    name: Test backend selection and crash recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Install Linux desktop audio build dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev pkg-config
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Compile FilmCraft desktop
        run: cargo check --locked -p filmcraft
      - name: Test graphics backend selection and fallback
        run: cargo test --locked -p filmcraft --bin filmcraft graphics::tests
      - name: Test saved GPU settings migration
        run: cargo test --locked -p filmcraft-engine gpu_control_preference_tests

  windows-dx12-compile:
    name: Compile Windows backend setup and verify DXC packaging
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Check Windows packaging script syntax
        shell: pwsh
        run: |
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/package.ps1'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Verify pinned Microsoft DXC runtime archive
        shell: pwsh
        run: |
          $version = '1.9.2609'
          $archiveName = 'dxc_2026_09_29.zip'
          $uri = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v$version/$archiveName"
          $expectedSha256 = 'ad31b1fc8443175d204f77a611fdb3ef2ec42759bdc2f1167368de24a4a7e7f1'
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          Invoke-WebRequest -Uri $uri -OutFile $archivePath
          $actualSha256 = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "DXC archive checksum mismatch: expected $expectedSha256, received $actualSha256"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName -replace '\\\\', '/' })
            $compilers = @($entries | Where-Object { $_ -match '(?i)dxcompiler\\.dll$' })
            $validators = @($entries | Where-Object { $_ -match '(?i)dxil\\.dll$' })
            if ($compilers.Count -eq 0) { throw 'Official DXC archive is missing dxcompiler.dll' }
            if ($validators.Count -eq 0) { throw 'Official DXC archive is missing dxil.dll' }
            Write-Output "Found $($compilers.Count) DXC compiler binaries and $($validators.Count) DXIL validator binaries."
          } finally {
            $zip.Dispose()
          }
      - name: Compile FilmCraft with Windows DX12/Vulkan backends
        run: cargo check --locked -p filmcraft
