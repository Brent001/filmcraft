name: One-time GPU integration formatter

on:
  push:
    branches:
      - integrate/gpu-effect-previews-intel-adapter
    paths:
      - .github/workflows/repair-gpu-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/gpu-effect-previews-intel-adapter
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Format the changed Rust files
        run: |
          cargo fmt --all
          git add crates/gpu/src/adapter.rs
          git add crates/gpu/src/fx.rs
          git add crates/gpu/src/fx_tests.rs
          git add crates/gpu/src/lib.rs
          git add crates/render/src/gpufx.rs
          git add crates/render/src/plan.rs
          git add crates/ui-egui/src/frames.rs
          git add crates/ui-egui/src/lib.rs
          if git diff --cached --quiet; then
            echo "Rust formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format GPU integration changes"
          git push origin HEAD:integrate/gpu-effect-previews-intel-adapter
